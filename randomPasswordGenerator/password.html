<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Password Generator</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>

    <div class="card">
        <h2>Password Generator</h2>

        <!-- Password Display & Copy -->
        <div class="input-box">
            <input type="text" id="password" readonly placeholder="Click Generate">
        </div>

        <!-- Options -->
        <div class="option">
            <label>Length: <span id="lengthValue">12</span></label>
            <input type="number" id="length" min="6" max="30">
        </div>



        <!-- Generate Button -->
        <button id="generateBtn" class="gen-btn">Generate Password</button>
    </div>

    <script src="password.js"></script>
</body>
</html>
