<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="guessGame.css">
  <title>Number Guessing Game</title>
</head>
<body>

  <div class="game-card">
    <h1>Guess The Number</h1>
    <p>Guess a number between 1 and 100</p>

    <input type="number" id="guessInput" placeholder="Enter number" min="1" max="100">
    <br>
    <button class="btn guess-btn">Guess</button>
    <button class="btn restart-btn">Play Again</button>

    <div class="message">Enter a number to start!</div>
    <div class="stats"></div>
    <div class="stats previous">previous Attempts: <span></span></div>
  </div>

</body>
<script src="guessGame.js"></script>
</html>
