<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="characterCounter.css">
    <title>Character Counter</title>
</head>
<body>
    <div class="counter-container">
  <h2>Live Character Counter</h2>
  <textarea id="text-input" placeholder="Type your text here..." maxlength="200"></textarea>
  <div class="counter-info">
    <span id="char-count">0</span> / <span id="max-count">200</span> characters
  
  </div>
</div>
</body>
<script src="charcterCounter.js"></script>
</html>
